name: drift_studio_example
description: Demo app for drift_studio with a seeded in-memory database.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.20.0
  drift_studio:
    path: ../
  sqlite3: ">=2.4.0 <4.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
